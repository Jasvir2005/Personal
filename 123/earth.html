<!DOCTYPE html>
<html>
<head>
    <title>Mini Google Earth</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
    body{
        text-align: center;
        font-family: Arial;
        background: #f2f2f2;
    }

    #map{
        height: 500px;
        width: 90%;
        margin: auto;
        border: 3px solid black;
    }

    </style>
</head>
<body>

<h2>🌍 Mini Google Earth Project</h2>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
// Map create
var map = L.map('map').setView([20, 78], 4);

// Satellite style map
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// Marker example
var marker = L.marker([28.6139, 77.2090]).addTo(map);
marker.bindPopup("📍 New Delhi, India").openPopup();

var search = prompt("Enter latitude, longitude");
var arr = search.split(",");

map.setView([arr[0], arr[1]], 8);
L.marker([arr[0], arr[1]]).addTo(map);

</script>
</body>
</html>
